[project]
name = "pca-from-scratch"
version = "1.0.0"
description = "PCA from scratch: power iteration + deflation, verified on sklearn digits + live market data"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3", "matplotlib>=3.7", "pandas>=2.0", "scipy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
