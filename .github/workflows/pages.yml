name: Deploy docs to GitHub Pages
on:
  push:
    branches: [main]
    paths: [preview.html, docs/**, experiments/make_site.py, results/figures/**]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: |
          PYTHONPATH=src python experiments/run_all.py
          PYTHONPATH=src python experiments/make_gifs.py
          PYTHONPATH=src python experiments/make_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
